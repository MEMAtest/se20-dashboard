name: Android companion checks
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/build-android-release.mjs']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/build-android-release.mjs']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-failure-reports
          path: android/app/build/reports/
          retention-days: 3
